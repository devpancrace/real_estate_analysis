name: CI for next branch

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12.3
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.3
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
            if [ -d tests ]; then
                pytest
            else
                echo "No tests found, skipping test execution."
            fi

  create-pr:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/next' && success() }}

    steps:
      - uses: actions/checkout@v3
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated PR from next to main"
          branch: next
          base: main
          title: "Merge changes from next to main"
          body: |
            Cette PR est créée automatiquement après push sur `next`.
            Merci de faire la revue avant de merger.
          labels: 'auto-pr'
          draft: false
